[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-windows"
version = "0.1.0"
description = "Fourier series mathematical engine & desktop suite for Windows with numerical quadrature, visualization, and audio synthesis"
authors = [
  { name="Arthur Londres" },
]
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
  "matplotlib>=3.5"
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[project.scripts]
fourier-windows = "fourier_toolbox.cli:main"
fourier-cli = "fourier_toolbox.cli:main"
